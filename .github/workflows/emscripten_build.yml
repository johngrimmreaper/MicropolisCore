# Temporary packaging asset builder for the Ubuntu Noble packaging branch.
# This exists only on build-assets/ubuntu-24.04-noble and never changes upstream main.
name: Build Micropolis packaging assets

on:
  push:
    branches:
      - build-assets/ubuntu-24.04-noble

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging asset branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production Micropolis web application
        run: |
          emcc --version
          pnpm --filter micropolis run build
          test -s apps/micropolis/build/index.html
          test -n "$(find apps/micropolis/build -type f -name '*.wasm' -print -quit)"

      - name: Freeze packaging payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .packaging-assets
          install -d .packaging-assets/micropolis-web
          cp -a apps/micropolis/build/. .packaging-assets/micropolis-web/
          cat > .packaging-assets/BUILDINFO <<EOF
          Source-Commit: $(git rev-parse HEAD^)
          Generator-Commit: $(git rev-parse HEAD)
          Node: $(node --version)
          pnpm: $(pnpm --version)
          Emscripten: $(emcc --version | head -n 1)
          Generated-UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Commit generated payload to temporary branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .packaging-assets
          git diff --cached --check
          git commit -m 'build: freeze Micropolis web assets for Noble packaging'
          git push origin HEAD:build-assets/ubuntu-24.04-noble
